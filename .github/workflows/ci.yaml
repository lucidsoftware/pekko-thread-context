name: CI
on:
  pull_request:
  push:
    branches:
      - master
    tags:
      - "*.*"

env:
  java_version: '25'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v3
        with:
          java-version: '${{ env.java_version }}'
          distribution: corretto
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Set SBT_OPTS
        run: bash generate_sbt_opts.sh
      - name: Build
        run: sbt +package
      - uses: actions/upload-artifact@v7
        with:
          name: jars
          path: 'target/out/jvm/scala-*/pekko-actor-thread-context/*.jar'
          if-no-files-found: error
          retention-days: 1
      - name: Test
        run: sbt +test
  publish:
    if: "${{ github.event_name != 'pull_request' && github.repository == 'lucidsoftware/pekko-thread-context' }}"
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v3
        with:
          java-version: '${{ env.java_version }}'
          distribution: corretto
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Set SBT_OPTS
        run: bash generate_sbt_opts.sh
      - name: Publish to Sonatype
        run: bash publish.sh
        env:
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
  release:
    if: ${{ startsWith(github.ref, 'refs/tags') && (github.repository == 'lucidsoftware/pekko-thread-context') }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          name: jars
          path: artifacts
      - name: Upload Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash release.sh
